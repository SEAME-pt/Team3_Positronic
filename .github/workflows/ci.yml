name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The Makefile runs commands in a throwaway container. -T: no terminal in CI.
      RUN_DEV: docker compose run --rm -T dev
    steps:
      - uses: actions/checkout@v4

      - name: Read the runner's uid and gid
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: positronic-dev:jazzy
          build-args: |
            ROS_DISTRO=jazzy
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ament_uncrustify, cpplint, cppcheck, flake8, pep257, copyright (scripts/lint.sh)
      - name: Format check
        run: make RUN="$RUN_DEV" format-check

      - name: Build
        run: make RUN="$RUN_DEV" build

      # Unit tests plus each package's linters (the same ones, plus lint_cmake and xmllint)
      - name: Test
        run: make RUN="$RUN_DEV" test

      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log
            build/*/test_results
          if-no-files-found: ignore