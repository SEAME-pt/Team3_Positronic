name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The Makefile runs commands in a throwaway container. -T: no terminal in CI.
      RUN_DEV: docker compose run --rm -T dev
    steps:
      # fetch-depth 2: on a PR, HEAD is GitHub's merge commit and HEAD^1 the tip of the base
      # branch, so `git diff HEAD^1 HEAD` is what the PR changes (tidy on changed TUs below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read the runner's uid and gid
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The "ci" target of docker/Dockerfile: build and lint tools plus MoveIt, no Gazebo or GUI.
      # Tagged positronic-dev:jazzy because that is the image compose.yaml runs, so
      # `docker compose run` finds it and does not rebuild the full dev image.
      - name: Build the CI image
        uses: docker/build-push-action@v6
        with:
          context: docker
          target: ci
          load: true
          tags: positronic-dev:jazzy
          build-args: |
            ROS_DISTRO=jazzy
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # ament_uncrustify, cpplint, cppcheck, flake8, pep257, copyright (scripts/lint.sh).
      # FORCE_COLOR: the GitHub log shows colours, but -T gives the container no terminal.
      - name: Format check
        run: make RUN="docker compose run --rm -T -e FORCE_COLOR=1 dev" format-check

      # make format must change nothing. The check above runs only uncrustify, which also accepts
      # code that clang-format would rewrite, so without this step `make format` keeps rewriting
      # files nobody touched (#119). On failure: the files, then the diff to apply.
      - name: Format is idempotent
        run: |
          make RUN="$RUN_DEV" format
          git diff --stat --exit-code || { git diff; exit 1; }

      # The unit tests of scripts/ (coverage gate, test summary). No build needed, no ROS.
      - name: Script tests
        run: $RUN_DEV python3 -m pytest -q scripts

      - name: Build
        run: make RUN="$RUN_DEV" build

      # Unit tests plus each package's linters (the same ones, plus lint_cmake and xmllint), then
      # scripts/summarize_tests.py: one line per package and each failure. Its table goes to the
      # job summary through log/, like the coverage report below.
      - name: Test
        run: >-
          make test
          RUN="docker compose run --rm -T -e FORCE_COLOR=1
          -e GITHUB_STEP_SUMMARY=/ws/log/test-summary.md dev"

      - name: Test report in the job summary
        if: always()
        run: cat log/test-summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No test report"

      # Line coverage of src/, C++ and Python (scripts/coverage.sh, scripts/coverage_gate.py).
      # Each package must reach 80 %; the total is only shown. Own build in build_cov/, so the
      # build/ of the steps around it is not touched.
      #   Counted:  C++ and Python under src/, including files no test runs (at 0 %)
      #   Excluded: */test/* (tests covering themselves), */launch/* (configuration, checked in
      #             the simulation), */setup.py (packaging), see .coveragerc
      # Report-only until #46 (Sprint 03): a package below 80 % marks this step red, but the job
      # still passes. Remove continue-on-error then.
      # The gate writes its table to GITHUB_STEP_SUMMARY. The container can't see the runner's
      # file, so it writes into coverage/ (the repo is mounted at /ws) and the next step copies it.
      - name: Coverage (report-only)
        continue-on-error: true
        run: >-
          make coverage
          RUN="docker compose run --rm -T -e GITHUB_STEP_SUMMARY=/ws/coverage/summary.md dev"

      - name: Coverage report in the job summary
        if: always()
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No coverage report"

      # clang-tidy on the strict packages (TIDY_STRICT_FILES in the Makefile): any warning fails.
      # Needs the Build step above: build/compile_commands.json and the depfiles.
      # #144 experiment E4: on a PR, only the TUs the PR can affect (scripts/tidy_changed.py:
      # changed files, headers through the depfiles, CMakeLists/package.xml -> whole package,
      # .clang-tidy, docker/Dockerfile or TIDY_STRICT_FILES -> everything). Full run otherwise.
      - name: Static analysis (clang-tidy)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Event $EVENT: full run"
            make RUN="$RUN_DEV" tidy-strict
            exit
          fi
          python3 scripts/tidy_changed.py --base HEAD^1 --head HEAD --format regex \
            --summary "$GITHUB_STEP_SUMMARY" > tidy_selection.txt
          selection=$(cat tidy_selection.txt)
          if [ "$selection" = ALL ]; then
            make RUN="$RUN_DEV" tidy-strict
          elif [ -z "$selection" ]; then
            echo "No strict TU affected: nothing to check"
          else
            start=$(date +%s)
            $RUN_DEV bash -c 'run-clang-tidy -quiet -p build -warnings-as-errors="*" "$1"' \
              _ "$selection"
            echo "clang-tidy took $(( $(date +%s) - start )) s"
          fi

      # #144 experiment E4 only, not for dev: the same selection from a plain grep of the
      # depfiles (only direct file matches, no package or full-run rules), to compare.
      - name: "E4: cross-check the selection with the depfiles"
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          strict=$(sed -n 's/^TIDY_STRICT_FILES *:= *//p' Makefile)
          for f in $(git diff --name-only --no-renames HEAD^1 HEAD); do
            grep -rlE --include='*.o.d' "(^| )/ws/$f( |$)" build || true
          done | while read -r d; do
            tr -s ' \\' '\n\n' < "$d" | grep -v '^$' | sed -n 2p
          done | grep -E "$strict" | sort -u > tidy_grep.txt || true
          python3 scripts/tidy_changed.py --base HEAD^1 --head HEAD 2>/dev/null | sort > tidy_script.txt
          echo "grep: $(wc -l < tidy_grep.txt) TUs, script: $(wc -l < tidy_script.txt)"
          diff tidy_grep.txt tidy_script.txt && echo "Same TU list"
          {
            echo "### E4 cross-check: grep of the depfiles vs scripts/tidy_changed.py"
            echo; echo '```'; diff tidy_grep.txt tidy_script.txt && echo "Same TU list"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Jetson builds this target, so CI checks that it still builds. Since it shares the core
      # layers with the image above, it costs little. No cache-to: writing to the same scope
      # would replace the ci image's cache.
      - name: Build the Jetson image
        uses: docker/build-push-action@v6
        with:
          context: docker
          target: runtime
          load: true
          tags: positronic-runtime:ci
          build-args: |
            ROS_DISTRO=jazzy
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=image

      # Same build as `make nano-build`: the Jetson's packages (NANO_PACKAGES in the Makefile) in
      # the runtime image. If one of them needs something only in tools or sim (MoveIt, Gazebo,
      # clang tools), it fails here, not on the Jetson. Outputs go to /tmp so they don't mix with
      # the build/ of the steps above.
      # Limit: CI is amd64 and the Jetson arm64, so an arm64-only problem still shows up there.
      - name: Build the Jetson packages in the Jetson image
        run: |
          packages=$(make -s nano-packages)
          echo "NANO_PACKAGES: $packages"
          docker run --rm -v "$PWD:/ws" positronic-runtime:ci bash -c "
            source /opt/ros/jazzy/setup.bash &&
            colcon --log-base /tmp/log build --symlink-install \
              --build-base /tmp/build --install-base /tmp/install \
              --packages-up-to $packages"

      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log
            build/*/test_results
          if-no-files-found: ignore
