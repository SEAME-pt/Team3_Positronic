name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The Makefile runs commands in a throwaway container. -T: no terminal in CI.
      RUN_DEV: docker compose run --rm -T dev
    steps:
      - uses: actions/checkout@v4

      - name: Read the runner's uid and gid
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The "ci" target of docker/Dockerfile: build and lint tools plus MoveIt, no Gazebo or GUI.
      # Tagged positronic-dev:jazzy because that is the image compose.yaml runs, so
      # `docker compose run` finds it and does not rebuild the full dev image.
      - name: Build the CI image
        uses: docker/build-push-action@v6
        with:
          context: docker
          target: ci
          load: true
          tags: positronic-dev:jazzy
          build-args: |
            ROS_DISTRO=jazzy
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # ament_uncrustify, cpplint, cppcheck, flake8, pep257, copyright (scripts/lint.sh)
      - name: Format check
        run: make RUN="$RUN_DEV" format-check

      - name: Build
        run: make RUN="$RUN_DEV" build

      # Unit tests plus each package's linters (the same ones, plus lint_cmake and xmllint)
      - name: Test
        run: make RUN="$RUN_DEV" test

      # The Jetson builds this target, so CI checks that it still builds. Since it shares the core
      # layers with the image above, it costs little. No cache-to: writing to the same scope
      # would replace the ci image's cache.
      - name: Build the Jetson image
        uses: docker/build-push-action@v6
        with:
          context: docker
          target: runtime
          load: true
          tags: positronic-runtime:ci
          build-args: |
            ROS_DISTRO=jazzy
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=image

      # `make nano-build` builds all of src/ in the runtime image, so CI does the same: a package
      # that needs something only in tools or sim (MoveIt, Gazebo, clang tools) fails here, not
      # on the Jetson. Outputs go to /tmp so they don't mix with the build/ of the steps above.
      # Limit: CI is amd64 and the Jetson arm64, so an arm64-only problem still shows up there.
      - name: Build the workspace in the Jetson image
        run: >
          docker run --rm -v "$PWD:/ws" positronic-runtime:ci
          bash -c 'source /opt/ros/jazzy/setup.bash && colcon --log-base /tmp/log build
          --symlink-install --build-base /tmp/build --install-base /tmp/install'

      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log
            build/*/test_results
          if-no-files-found: ignore
