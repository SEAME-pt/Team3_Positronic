name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The Makefile runs commands in a throwaway container. -T: no terminal in CI.
      RUN_DEV: docker compose run --rm -T dev
    steps:
      - uses: actions/checkout@v4

      - name: Read the runner's uid and gid
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The "ci" target of docker/Dockerfile: build and lint tools plus MoveIt, no Gazebo or GUI.
      # Tagged positronic-dev:jazzy because that is the image compose.yaml runs, so
      # `docker compose run` finds it and does not rebuild the full dev image.
      - name: Build the CI image
        uses: docker/build-push-action@v6
        with:
          context: docker
          target: ci
          load: true
          tags: positronic-dev:jazzy
          build-args: |
            ROS_DISTRO=jazzy
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # ament_uncrustify, cpplint, cppcheck, flake8, pep257, copyright (scripts/lint.sh)
      - name: Format check
        run: make RUN="$RUN_DEV" format-check

      - name: Build
        run: make RUN="$RUN_DEV" build

      # Unit tests plus each package's linters (the same ones, plus lint_cmake and xmllint)
      - name: Test
        run: make RUN="$RUN_DEV" test

      # Line coverage of src/, C++ and Python (scripts/coverage.sh, scripts/coverage_gate.py).
      # Each package must reach 80 %; the total is only shown. Own build in build_cov/, so the
      # build/ of the steps around it is not touched.
      #   Counted:  C++ and Python under src/, including files no test runs (at 0 %)
      #   Excluded: */test/* (tests covering themselves), */launch/* (configuration, checked in
      #             the simulation), */setup.py (packaging), see .coveragerc
      # Report-only until #46 (Sprint 03): a package below 80 % marks this step red, but the job
      # still passes. Remove continue-on-error then.
      # The gate writes its table to GITHUB_STEP_SUMMARY. The container can't see the runner's
      # file, so it writes into coverage/ (the repo is mounted at /ws) and the next step copies it.
      - name: Coverage (report-only)
        continue-on-error: true
        run: >-
          make coverage
          RUN="docker compose run --rm -T -e GITHUB_STEP_SUMMARY=/ws/coverage/summary.md dev"

      - name: Coverage report in the job summary
        if: always()
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No coverage report"

      # clang-tidy on the strict packages (TIDY_STRICT_FILES in the Makefile): any warning fails.
      # Needs the Build step above, which writes build/compile_commands.json
      - name: Static analysis (clang-tidy)
        run: make RUN="$RUN_DEV" tidy-strict

      # The Jetson builds this target, so CI checks that it still builds. Since it shares the core
      # layers with the image above, it costs little. No cache-to: writing to the same scope
      # would replace the ci image's cache.
      - name: Build the Jetson image
        uses: docker/build-push-action@v6
        with:
          context: docker
          target: runtime
          load: true
          tags: positronic-runtime:ci
          build-args: |
            ROS_DISTRO=jazzy
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=image

      # Same build as `make nano-build`: the Jetson's packages (NANO_PACKAGES in the Makefile) in
      # the runtime image. If one of them needs something only in tools or sim (MoveIt, Gazebo,
      # clang tools), it fails here, not on the Jetson. Outputs go to /tmp so they don't mix with
      # the build/ of the steps above.
      # Limit: CI is amd64 and the Jetson arm64, so an arm64-only problem still shows up there.
      - name: Build the Jetson packages in the Jetson image
        run: |
          packages=$(make -s nano-packages)
          echo "NANO_PACKAGES: $packages"
          docker run --rm -v "$PWD:/ws" positronic-runtime:ci bash -c "
            source /opt/ros/jazzy/setup.bash &&
            colcon --log-base /tmp/log build --symlink-install \
              --build-base /tmp/build --install-base /tmp/install \
              --packages-up-to $packages"

      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log
            build/*/test_results
          if-no-files-found: ignore
