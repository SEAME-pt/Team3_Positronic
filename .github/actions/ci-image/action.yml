name: CI image
description: >-
  Build the "ci" target of docker/Dockerfile (build and lint tools plus MoveIt, no Gazebo or GUI)
  from the GHA layer cache, tagged positronic-dev:jazzy because that is the image compose.yaml
  runs, so `docker compose run` finds it and does not rebuild the full dev image.

inputs:
  save-cache:
    description: >-
      "true" writes the layers back to the cache. Only one job per run does it, so parallel jobs
      don't write the same scope at the same time.
    default: "false"

runs:
  using: composite
  steps:
    - name: Read the runner's uid and gid
      id: ids
      shell: bash
      run: |
        echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
        echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - name: Build the CI image
      uses: docker/build-push-action@v6
      with:
        context: docker
        target: ci
        load: true
        tags: positronic-dev:jazzy
        build-args: |
          ROS_DISTRO=jazzy
          USER_UID=${{ steps.ids.outputs.uid }}
          USER_GID=${{ steps.ids.outputs.gid }}
        cache-from: type=gha,scope=image
        cache-to: ${{ inputs.save-cache == 'true' && 'type=gha,mode=max,scope=image' || '' }}
