<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="a_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1124"/>
      <stop offset="0.55" stop-color="#080d1b"/>
      <stop offset="1" stop-color="#04060d"/>
    </linearGradient>
    <radialGradient id="a_cy" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a_mg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a_ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="a_hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="a_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="a_soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <pattern id="a_dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#172b4d"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#a_bg)"/>
  <rect width="1200" height="480" fill="url(#a_dots)" opacity="0.7"/>
  <ellipse cx="150" cy="90" rx="420" ry="300" fill="url(#a_cy)"/>
  <ellipse cx="1010" cy="400" rx="420" ry="300" fill="url(#a_mg)"/>

  <g filter="url(#a_glow)" opacity="0.95">
    <g transform="translate(925,245)">
      <ellipse rx="165" ry="165" fill="none" stroke="url(#a_ring)" stroke-width="1.6" opacity="0.55"/>
      <ellipse rx="165" ry="62" fill="none" stroke="url(#a_ring)" stroke-width="2" opacity="0.9" transform="rotate(26)"/>
      <ellipse rx="165" ry="62" fill="none" stroke="url(#a_ring)" stroke-width="1.6" opacity="0.6" transform="rotate(-34)"/>
      <ellipse rx="62" ry="165" fill="none" stroke="url(#a_ring)" stroke-width="1.4" opacity="0.5" transform="rotate(10)"/>
      <ellipse rx="120" ry="120" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>
    </g>
    <g transform="translate(925,245)">
      <circle r="54" fill="#0b1220" opacity="0.9"/>
      <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="url(#a_hex)"/>
      <circle r="11" fill="#e0f2fe"/>
    </g>
    <g>
      <circle cx="760" cy="245" r="6" fill="#22d3ee"/>
      <circle cx="1090" cy="245" r="6" fill="#a855f7"/>
      <circle cx="925" cy="80" r="5" fill="#818cf8"/>
      <circle cx="925" cy="410" r="5" fill="#38bdf8"/>
      <circle cx="1005" cy="130" r="4" fill="#22d3ee"/>
      <circle cx="845" cy="360" r="4" fill="#a855f7"/>
      <line x1="760" y1="245" x2="884" y2="245" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
      <line x1="1090" y1="245" x2="966" y2="245" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
      <line x1="925" y1="80" x2="925" y2="200" stroke="#818cf8" stroke-width="1" opacity="0.5"/>
      <line x1="925" y1="410" x2="925" y2="290" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <g>
    <text x="64" y="140" font-size="13.5" letter-spacing="5" fill="#38bdf8">SEA:ME 2.0 · STATIONARY 6-DOF ARM</text>
    <text x="58" y="226" font-size="74" font-weight="800" fill="#f8fafc">POSITRONIC</text>
    <text x="64" y="266" font-size="19" fill="#94a3b8">ROS 2 control of a myCobot 280 Jetson Nano</text>
  </g>
  <g font-size="14" fill="#cbd5e1">
    <g><rect x="64" y="308" width="96" height="34" rx="17" fill="#0f2038" stroke="#1e3a5f"/><text x="112" y="330" text-anchor="middle">ROS 2</text></g>
    <g><rect x="172" y="308" width="110" height="34" rx="17" fill="#0f2038" stroke="#1e3a5f"/><text x="227" y="330" text-anchor="middle">MoveIt 2</text></g>
    <g><rect x="294" y="308" width="104" height="34" rx="17" fill="#0f2038" stroke="#1e3a5f"/><text x="346" y="330" text-anchor="middle">Gazebo</text></g>
    <g><rect x="410" y="308" width="140" height="34" rx="17" fill="#0f2038" stroke="#1e3a5f"/><text x="480" y="330" text-anchor="middle">ros2_control</text></g>
    <g><rect x="562" y="308" width="150" height="34" rx="17" fill="#0f2038" stroke="#1e3a5f"/><text x="637" y="330" text-anchor="middle">Jetson Nano</text></g>
  </g>
</svg>
