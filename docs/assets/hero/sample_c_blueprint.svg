<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="c_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02110d"/>
      <stop offset="0.6" stop-color="#03130f"/>
      <stop offset="1" stop-color="#010604"/>
    </linearGradient>
    <radialGradient id="c_gr" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c_line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="c_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="c_grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#0e3b30" stroke-width="1"/>
    </pattern>
    <mask id="c_fade"><rect width="1200" height="480" fill="url(#c_m)"/></mask>
    <radialGradient id="c_m" cx="0.72" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#c_bg)"/>
  <rect width="1200" height="480" fill="url(#c_grid)" mask="url(#c_fade)" opacity="0.8"/>
  <ellipse cx="900" cy="250" rx="460" ry="320" fill="url(#c_gr)"/>

  <g stroke="#0f766e" stroke-width="1" opacity="0.6">
    <line x1="120" y1="120" x2="120" y2="420"/><line x1="90" y1="120" x2="150" y2="120"/>
    <line x1="90" y1="420" x2="150" y2="420"/>
    <line x1="1120" y1="90" x2="1120" y2="150"/><line x1="1090" y1="90" x2="1150" y2="90"/>
  </g>
  <text x="132" y="126" font-size="11" fill="#34d399" opacity="0.8">J6</text>
  <text x="132" y="426" font-size="11" fill="#34d399" opacity="0.8">BASE</text>

  <g filter="url(#c_glow)" fill="none" stroke="url(#c_line)" stroke-linecap="round">
    <path d="M820 412 L742 300" stroke-width="4"/>
    <path d="M742 300 L846 232" stroke-width="3.4"/>
    <path d="M846 232 L958 276" stroke-width="3"/>
    <line x1="958" y1="276" x2="1004" y2="250" stroke-width="2.6"/>
    <line x1="958" y1="276" x2="1006" y2="298" stroke-width="2.6"/>
    <path d="M820 412 L742 300 L846 232 L958 276" stroke-width="1" opacity="0.6" stroke-dasharray="4 6"/>
    <path d="M820 412 L846 232 M742 300 L958 276" stroke-width="1" opacity="0.35" stroke-dasharray="3 7"/>
  </g>
  <g filter="url(#c_glow)">
    <circle cx="820" cy="412" r="9" fill="#022c22" stroke="#34d399" stroke-width="3"/>
    <circle cx="742" cy="300" r="8" fill="#022c22" stroke="#34d399" stroke-width="3"/>
    <circle cx="846" cy="232" r="7" fill="#022c22" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="958" cy="276" r="6" fill="#022c22" stroke="#22d3ee" stroke-width="3"/>
  </g>
  <g fill="#a7f3d0" font-size="10" font-family="monospace">
    <text x="830" y="416">J1</text><text x="700" y="296">J2</text><text x="858" y="228">J3</text><text x="968" y="292">J6</text>
  </g>
  <rect x="760" y="430" width="120" height="8" rx="4" fill="#0b3b30"/>
  <rect x="760" y="430" width="76" height="8" rx="4" fill="#34d399"/>

  <g font-size="14" fill="#cbd5e1">
    <text x="64" y="140" font-size="13.5" letter-spacing="5" fill="#34d399">DIGITAL TWIN · HARDWARE INTERFACE</text>
    <text x="58" y="226" font-size="74" font-weight="800" fill="#f8fafc">POSITRONIC</text>
    <text x="64" y="266" font-size="19" fill="#94a3b8">Joint limits, frames and control loop</text>
  </g>
  <g font-size="13" fill="#a7f3d0" font-family="monospace">
    <text x="64" y="316">6 DOF · 280 mm · ±0.5 mm · 250 g payload</text>
    <text x="64" y="340">serial 0xFE 0xFE @ 1000000 baud</text>
  </g>
</svg>
