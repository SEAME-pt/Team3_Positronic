<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pl_ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="pl_fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="pl_arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pl_word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="pl_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pl_shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="translate(140,140)">
    <g filter="url(#pl_glow)">
      <polygon points="0,-98 84.9,-49 84.9,49 0,98 -84.9,49 -84.9,-49" fill="none" stroke="url(#pl_ring)" stroke-width="4"/>
    </g>
    <polygon points="0,-72 62.4,-36 62.4,36 0,72 -62.4,36 -62.4,-36" fill="url(#pl_fill)" stroke="url(#pl_ring)" stroke-width="1.4" opacity="0.9"/>
    <g transform="rotate(-22)">
      <ellipse rx="116" ry="44" fill="none" stroke="url(#pl_ring)" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.8"/>
      <circle cx="116" cy="0" r="4.5" fill="#22d3ee"/>
      <circle cx="-116" cy="0" r="4.5" fill="#a855f7"/>
      <circle cx="0" cy="44" r="3.5" fill="#6366f1"/>
      <circle cx="0" cy="-44" r="3.5" fill="#38bdf8"/>
    </g>

    <g transform="translate(-140,-140)">
      <g filter="url(#pl_shadow)" fill="none" stroke="url(#pl_arm)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M140 196 L104 148" stroke-width="14"/>
        <path d="M104 148 L170 116" stroke-width="12"/>
        <path d="M170 116 L200 150" stroke-width="9"/>
        <line x1="200" y1="150" x2="222" y2="138" stroke-width="6"/>
        <line x1="200" y1="150" x2="224" y2="160" stroke-width="6"/>
      </g>
      <g>
        <circle cx="140" cy="196" r="11" fill="#ffffff" stroke="url(#pl_arm)" stroke-width="4"/>
        <circle cx="104" cy="148" r="9" fill="#ffffff" stroke="url(#pl_arm)" stroke-width="4"/>
        <circle cx="170" cy="116" r="8" fill="#ffffff" stroke="url(#pl_arm)" stroke-width="4"/>
        <circle cx="200" cy="150" r="6.5" fill="#ffffff" stroke="url(#pl_arm)" stroke-width="3.5"/>
      </g>
    </g>
  </g>

  <text x="300" y="166" font-size="88" font-weight="800" letter-spacing="2" fill="url(#pl_word)">POSITRONIC</text>
  <line x1="304" y1="184" x2="440" y2="184" stroke="url(#pl_word)" stroke-width="3" stroke-linecap="round"/>
  <text x="304" y="212" font-size="18" letter-spacing="5" fill="#64748b">ROS 2 · SIX-AXIS ROBOTICS · EDGE AI</text>
  <text x="304" y="244" font-size="13" letter-spacing="4" fill="#94a3b8">SEA:ME 2.0 · MYCOBOT 280 JETSON NANO</text>
</svg>
