<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="560" height="440" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#111">Risk matrix</text>
  <text x="24" y="54" font-size="12" fill="#555">Likelihood (x) vs impact (y). Cells shade from low to high.</text>

  <g transform="translate(90,80)">
    <g>
      <rect x="0" y="0" width="72" height="60" fill="#fee5d9"/>
      <rect x="72" y="0" width="72" height="60" fill="#fcae91"/>
      <rect x="144" y="0" width="72" height="60" fill="#fb6a4a"/>
      <rect x="216" y="0" width="72" height="60" fill="#de2d26"/>
      <rect x="288" y="0" width="72" height="60" fill="#a50f15"/>

      <rect x="0" y="60" width="72" height="60" fill="#fee5d9"/>
      <rect x="72" y="60" width="72" height="60" fill="#fee5d9"/>
      <rect x="144" y="60" width="72" height="60" fill="#fcae91"/>
      <rect x="216" y="60" width="72" height="60" fill="#fb6a4a"/>
      <rect x="288" y="60" width="72" height="60" fill="#de2d26"/>

      <rect x="0" y="120" width="72" height="60" fill="#fee5d9"/>
      <rect x="72" y="120" width="72" height="60" fill="#fee5d9"/>
      <rect x="144" y="120" width="72" height="60" fill="#fcae91"/>
      <rect x="216" y="120" width="72" height="60" fill="#fcae91"/>
      <rect x="288" y="120" width="72" height="60" fill="#fb6a4a"/>

      <rect x="0" y="180" width="72" height="60" fill="#fee5d9"/>
      <rect x="72" y="180" width="72" height="60" fill="#fee5d9"/>
      <rect x="144" y="180" width="72" height="60" fill="#fee5d9"/>
      <rect x="216" y="180" width="72" height="60" fill="#fcae91"/>
      <rect x="288" y="180" width="72" height="60" fill="#fcae91"/>

      <rect x="0" y="240" width="72" height="60" fill="#fee5d9"/>
      <rect x="72" y="240" width="72" height="60" fill="#fee5d9"/>
      <rect x="144" y="240" width="72" height="60" fill="#fee5d9"/>
      <rect x="216" y="240" width="72" height="60" fill="#fee5d9"/>
      <rect x="288" y="240" width="72" height="60" fill="#fcae91"/>
    </g>
    <g stroke="#fff" stroke-width="1">
      <line x1="0" y1="60" x2="360" y2="60"/><line x1="0" y1="120" x2="360" y2="120"/>
      <line x1="0" y1="180" x2="360" y2="180"/><line x1="0" y1="240" x2="360" y2="240"/>
      <line x1="72" y1="0" x2="72" y2="300"/><line x1="144" y1="0" x2="144" y2="300"/>
      <line x1="216" y1="0" x2="216" y2="300"/><line x1="288" y1="0" x2="288" y2="300"/>
    </g>
    <rect x="0" y="0" width="360" height="300" fill="none" stroke="#333"/>

    <text x="180" y="326" font-size="13" fill="#333" text-anchor="middle">Likelihood →</text>
    <text x="-150" y="0" font-size="13" fill="#333" text-anchor="middle" transform="rotate(-90)">Impact →</text>

    <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
      <circle cx="320" cy="30" r="12" fill="#a50f15"/><text x="320" y="35">1</text>
      <circle cx="248" cy="90" r="12" fill="#de2d26"/><text x="248" y="95">2</text>
      <circle cx="176" cy="150" r="12" fill="#fb6a4a"/><text x="176" y="155">3</text>
      <circle cx="320" cy="150" r="12" fill="#fb6a4a"/><text x="320" y="155">4</text>
      <circle cx="104" cy="210" r="12" fill="#fcae91"/><text x="104" y="215" fill="#111">5</text>
    </g>
  </g>
  <g font-size="12" fill="#333">
    <text x="24" y="404">1 Hardware availability · 2 Real-time determinism</text>
    <text x="24" y="422">3 Control loop latency · 4 Integration effort · 5 Team schedule</text>
  </g>
</svg>
