# Controllers of the real arm on the Jetson (#23). Read by ros2_control_node in
# driver.launch.py. Separate from ros2_controllers.yaml (Gazebo) because the rates and the
# controllers differ: the real arm takes one command every 50 ms (see SerialArm), Gazebo runs
# at 100 Hz.
controller_manager:
  ros__parameters:
    # Hz. Also the /joint_states publish rate, since joint_state_broadcaster publishes once
    # per update.
    #
    # The serial thread of SerialArm asks for a pose every 10 ms while no new command comes,
    # and runs turns of moving_period_ms (50 by default, #32) while it sends them. At 30 Hz an
    # update finds a fresh pose when the arm stands still, and when it moves the newest command
    # reaches the arm at most 1000 / moving_period_ms times a second, 20 with the default: the
    # ones in between are replaced, not queued. A higher rate would only repeat poses and
    # replace more commands.
    update_rate: 30
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Writes six positions straight into the command interfaces, no interpolation: for the
    # first motion of #32 and for jogging by hand. Not spawned by the launch; spawn it only
    # when nothing else owns the command interfaces (arm_controller cannot be active at the
    # same time), with the bench clear. Every message moves all six joints: publish the
    # current pose with one joint changed, never a bare target.
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position

forward_position_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    interface_name: position
