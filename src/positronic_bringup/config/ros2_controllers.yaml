# Controllers for the arm. Read by the controller_manager at start and by
# the arm_controller spawner.
# The arm now has a separate file which is jetson_controllers.yaml
controller_manager:
  ros__parameters:
    # 30 Hz, the rate of the real arm, so the JTC samples trajectories the same way as on the Jetson
    # Same rare used by ros2_control
    update_rate: 30
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_action_controller:
      type: position_controllers/GripperActionController

# Name used by MoveIt and the real arm: /arm_controller/follow_joint_trajectory
arm_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    # Position only: the arm firmware gives no velocity (get_servo_speeds would cost a second serial read).
    state_interfaces:
      - position
    # Tolerances (#33). The constraints below are copied from jetson_controllers.yaml,
    # which was verified by issue #33.
    constraints:
      goal_time: 1.0
      joint2_to_joint1:
        trajectory: 0.087
        goal: 0.070
      joint3_to_joint2:
        trajectory: 0.087
        goal: 0.070
      joint4_to_joint3:
        trajectory: 0.087
        goal: 0.070
      joint5_to_joint4:
        trajectory: 0.087
        goal: 0.070
      joint6_to_joint5:
        trajectory: 0.087
        goal: 0.070
      joint6output_to_joint6:
        trajectory: 0.087
        goal: 0.070

gripper_action_controller:
  ros__parameters:
    joint: gripper_controller
