# Controllers for the arm. Read by the controller_manager at start and by
# the arm_controller spawner. Same file is meant to work on the real arm.
controller_manager:
  ros__parameters:
    # Hz. Same rate as the real arm.
    # 100 until #20 measures the serial link.
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Name used by MoveIt and the real arm: /arm_controller/follow_joint_trajectory
arm_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    # Position only: the arm firmware gives no velocity (get_servo_speeds would cost a second serial read).
    state_interfaces:
      - position
